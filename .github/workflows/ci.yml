name: Verify Dao Den Long

on:
  push:
    branches: ["main"]
    tags: ["phase-*", "v*"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full verification gate
        run: python3 scripts/verify.py --ci

      - name: Verify Test Contract v1.2 headless CLI (Nights 1-3 + Phase 3)
        run: |
          python3 run.py headless --seed 42 --night 1 --scenario tests/scenarios/win_scenario.json --inputs tests/scenarios/win_inputs.json --ticks 600 --out /tmp/n1.jsonl
          python3 run.py headless --seed 42 --night 1 --scenario tests/scenarios/p3_fuel_relight_refuel_scenario.json --inputs tests/scenarios/p3_fuel_relight_refuel_inputs.json --ticks 700 --out /tmp/p3_fuel.jsonl
          python3 run.py headless --seed 42 --night 2 --scenario tests/scenarios/p2_night2_pad_charm_drifter_scenario.json --inputs tests/scenarios/p2_night2_pad_charm_drifter_inputs.json --ticks 80 --out /tmp/n2.jsonl
          python3 run.py headless --seed 42 --night 3 --scenario tests/scenarios/p2_night3_tiers_wind_scenario.json --inputs tests/scenarios/p2_night3_tiers_wind_inputs.json --ticks 80 --out /tmp/n3.jsonl
          tail -n 1 /tmp/n1.jsonl /tmp/p3_fuel.jsonl /tmp/n2.jsonl /tmp/n3.jsonl

      - name: Live HTTP server smoke test
        run: |
          python3 -c '
          import json, subprocess, sys, time, urllib.request
          proc = subprocess.Popen([sys.executable, "run.py", "--host", "127.0.0.1", "--port", "8123"])
          try:
              for _ in range(25):
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:8123/health", timeout=1) as resp:
                          assert resp.status == 200
                          data = json.loads(resp.read().decode("utf-8"))
                          assert data["status"] == "ok", data
                          assert data["contract_version"] == "1.2", data
                          print("Live HTTP /health OK:", data)
                          break
                  except Exception:
                      time.sleep(0.2)
              else:
                  raise RuntimeError("HTTP server failed to respond on /health")
          finally:
              proc.terminate()
              proc.wait(timeout=5)
          '
